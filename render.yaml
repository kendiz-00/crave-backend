# Render Deployment Configuration for CRAVE Backend
# This file configures the CRAVE backend for deployment on Render

services:
  # Web Service (Backend API)
  - type: web
    name: crave-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      # Node Environment
      - key: NODE_ENV
        value: production
      
      # Port (Render automatically sets PORT)
      - key: PORT
        value: 4000
      
      # Database URL (Render PostgreSQL)
      - key: DATABASE_URL
        fromDatabase:
          name: crave-db
          property: connectionString
      
      # JWT Secrets (Set in Render dashboard)
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      
      # Paystack Configuration (Set in Render dashboard)
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      
      # CORS Configuration
      - key: CORS_ALLOWED_ORIGINS
        value: https://crave.vercel.app,https://crave.com
      
      # Rate Limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      
      # Cache TTL
      - key: CACHE_TTL
        value: 300000
      
      # Client URL
      - key: CLIENT_URL
        value: https://crave.vercel.app

# PostgreSQL Database
databases:
  - name: crave-db
    databaseName: crave_db
    user: crave_user
    plan: starter
    region: oregon
