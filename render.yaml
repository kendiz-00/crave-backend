# Render Deployment Configuration for CRAVE Backend
# This file configures the CRAVE backend for deployment on Render

services:
  # Web Service (Backend API)
  - type: web
    name: crave-backend
    env: docker
    # The existing production Web Service and replacement database are in Ohio.
    region: ohio
    plan: starter
    # Docker build and start commands are handled by Dockerfile
    envVars:
      # Node Environment
      - key: NODE_ENV
        value: production

      - key: PAYMENT_MODE
        value: live

      - key: PUBLIC_API_URL
        value: https://crave-backend-oie3.onrender.com

      
      # Port (Render automatically sets PORT)
      - key: PORT
        value: 4000
      
      # Set securely in the existing Render service dashboard after verifying
      # crave-db-v2. Do not Blueprint-manage or auto-bind the database here.
      - key: DATABASE_URL
        sync: false
      
      # JWT Secrets (Set in Render dashboard)
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      
      # Paystack Configuration (Set in Render dashboard)
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false

      # SMS/OTP Configuration
      - key: SMS_PROVIDER
        value: africas_talking
      - key: AFRICAS_TALKING_USERNAME
        sync: false
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: OTP_EXPIRY_MINUTES
        value: 10
      - key: OTP_MAX_ATTEMPTS
        value: 3
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: 60

      # CORS Configuration
      - key: CORS_ALLOWED_ORIGINS
        value: https://crave-frontend.vercel.app,https://crave.vercel.app,https://crave.com,https://www.crave.com,https://craveghana.com,https://www.craveghana.com
      
      # Rate Limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      
      # Cache TTL
      - key: CACHE_TTL
        value: 300000
      
      # Client URL
      - key: CLIENT_URL
        value: https://crave-frontend.vercel.app
